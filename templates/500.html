{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h4 class="fw-bold text-dark">Internal Processing Error</h4>
    <p class="text-muted mb-4">An unexpected server error occurred. Transaction was rolled back safely.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
      <i class="fa-solid fa-house me-1"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
