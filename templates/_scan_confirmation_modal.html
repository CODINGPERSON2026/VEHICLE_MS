<!-- Modal: Interactive RFID Card Scan Confirmation (In / Out) -->
<div class="modal fade" id="scanConfirmationModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="scanConfirmationModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content rounded-4 border-0 shadow-lg overflow-hidden">
      <!-- Modal Header: Clean & Compact -->
      <div class="modal-header bg-dark text-white py-3 px-4 d-flex justify-content-between align-items-center border-0">
        <div class="d-flex align-items-center gap-2">
          <i class="fa-solid fa-shield-halved text-primary fs-5"></i>
          <h5 class="modal-title fw-bold text-white mb-0" id="scanConfirmationModalLabel">Verify Vehicle & Driver</h5>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-secondary font-monospace" id="modal-confirm-uid" style="font-size: 0.75rem;">UID: -</span>
          <button type="button" class="btn-close btn-close-white" onclick="cancelPendingScan()" aria-label="Close"></button>
        </div>
      </div>

      <!-- Modal Body: High Contrast, Clean & Uncluttered -->
      <div class="modal-body p-4 bg-white">
        <!-- Main Vehicle Plate Box -->
        <div class="text-center mb-3">
          <div class="bg-black text-warning font-monospace fw-bold text-center py-2 px-3 rounded-3 fs-2 border border-secondary shadow-sm letter-spacing-1 d-inline-block w-100" id="modal-confirm-plate" style="letter-spacing: 0.12em;">
            -
          </div>
          <div class="d-flex justify-content-center align-items-center gap-2 mt-2 flex-wrap">
            <span class="badge bg-light text-dark border px-3 py-1 fs-6" id="modal-confirm-type">-</span>
            <span class="badge bg-success px-3 py-1 fs-6" id="modal-confirm-auth-badge">AUTHORIZED</span>
            <span class="badge bg-secondary px-3 py-1 fs-6" id="modal-confirm-status-pill">-</span>
          </div>
        </div>

        <!-- Driver Details Box: Clean & High Visibility -->
        <div class="p-3 bg-light rounded-3 border mb-3">
          <div class="d-flex align-items-center gap-3">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 48px; height: 48px; min-width: 48px;">
              <i class="fa-solid fa-user-check fs-4"></i>
            </div>
            <div class="flex-grow-1 text-truncate">
              <div class="small text-muted fw-semibold" style="font-size: 0.72rem; letter-spacing: 0.05em;">ASSIGNED DRIVER</div>
              <h5 class="fw-bold text-dark mb-0 text-truncate" id="modal-confirm-driver-name">-</h5>
              <div class="text-muted small mt-1">
                <span id="modal-confirm-driver-rank" class="fw-semibold text-secondary">Staff Driver</span> &bull; 
                <span id="modal-confirm-driver-army" class="font-monospace">Army No: -</span>
              </div>
            </div>
          </div>

          <!-- Driver Phone & Quick Switch Link -->
          <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top small">
            <div>
              <span class="text-muted"><i class="fa-solid fa-phone me-1 text-primary"></i>Mobile:</span>
              <strong class="text-dark ms-1" id="modal-confirm-driver-mobile">-</strong>
            </div>
            <a class="text-primary text-decoration-none fw-semibold" data-bs-toggle="collapse" href="#collapseDriverSelect" role="button" aria-expanded="false" aria-controls="collapseDriverSelect">
              <i class="fa-solid fa-user-pen me-1"></i>Change Driver
            </a>
          </div>

          <!-- Collapsed Driver Selector (Only shown if guard clicks Change Driver) -->
          <div class="collapse mt-2" id="collapseDriverSelect">
            <select class="form-select form-select-sm" id="modal-confirm-driver-select" onchange="onConfirmDriverChanged(this.value)">
              <option value="">-- Keep Assigned Driver --</option>
            </select>
          </div>
        </div>

        <!-- Hidden telemetry placeholders for JS compatibility -->
        <div class="d-none">
          <span id="modal-confirm-custodian"></span>
          <span id="modal-confirm-veh-army"></span>
          <span id="modal-confirm-veh-mobile"></span>
          <span id="modal-confirm-status-alert"></span>
          <span id="modal-confirm-status-text"></span>
          <input type="text" id="modal-confirm-remarks" value="">
        </div>

        <!-- Direction Conflict Alert (Shows if active tab contradicts current location) -->
        <div id="modal-direction-conflict-alert" class="alert alert-danger py-2 px-3 rounded-3 mb-3 d-none align-items-center gap-2">
          <i class="fa-solid fa-circle-exclamation fs-4 flex-shrink-0"></i>
          <div class="small fw-semibold" id="modal-direction-conflict-msg">
            Vehicle state conflict.
          </div>
        </div>

        <!-- Big Dedicated Action Button (Strictly validated by vehicle IN / OUT location) -->
        <div class="mt-3">
          <!-- Confirm IN Button (Only valid when vehicle is OUTSIDE) -->
          <div id="wrapper-confirm-in">
            <button type="button" class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm rounded-3 fs-5 d-flex align-items-center justify-content-center gap-2" id="btn-confirm-in" onclick="confirmScan('ENTRY')">
              <i class="fa-solid fa-arrow-right-to-bracket fs-4"></i>
              <span>CONFIRM IN (Arrival to Depot)</span>
            </button>
          </div>

          <!-- Confirm OUT Button (Only valid when vehicle is INSIDE) -->
          <div id="wrapper-confirm-out">
            <button type="button" class="btn btn-warning text-dark btn-lg w-100 py-3 fw-bold shadow-sm rounded-3 fs-5 d-flex align-items-center justify-content-center gap-2" id="btn-confirm-out" onclick="confirmScan('EXIT')">
              <i class="fa-solid fa-arrow-right-from-bracket fs-4"></i>
              <span>CONFIRM OUT (Outbound Dispatch)</span>
            </button>
          </div>

          <!-- Footer Actions: Cancel and Status Hint -->
          <div class="d-flex justify-content-between align-items-center mt-3 pt-2">
            <button type="button" class="btn btn-sm btn-outline-secondary px-3" onclick="cancelPendingScan()">
              <i class="fa-solid fa-xmark me-1"></i>Cancel
            </button>

            <!-- Direction status pill / note -->
            <span class="small" id="modal-direction-hint">
              <i class="fa-solid fa-circle-info me-1 text-primary"></i>Direction verified
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
