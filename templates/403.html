{% extends "base.html" %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 fw-bold text-warning mb-2">403</div>
    <h4 class="fw-bold text-dark">Access Forbidden</h4>
    <p class="text-muted mb-4">You do not have the required role or permissions to view this resource.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
      <i class="fa-solid fa-house me-1"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
