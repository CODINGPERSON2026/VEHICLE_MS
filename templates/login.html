{% extends "base.html" %}

{% block title %}Sign In - {{ system_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-11 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 64px; height: 64px;">
            <i class="fa-solid fa-shield-halved fs-2"></i>
          </div>
          <h4 class="fw-bold text-dark">Gate Portal</h4>
          <p class="text-muted small">Smart RFID + ANPR Access Management</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
              <input type="text" class="form-control bg-light border-start-0" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label small text-muted" for="remember">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
          </button>
        </form>
      </div>
      <div class="card-footer bg-light border-top-0 text-center py-3 rounded-bottom-4">
        <span class="text-muted small">Offline-Ready Local Gate Control Engine</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
