{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 fw-bold text-secondary mb-2">404</div>
    <h4 class="fw-bold text-dark">Page Not Found</h4>
    <p class="text-muted mb-4">The requested page or endpoint does not exist on this gate server.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
      <i class="fa-solid fa-house me-1"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
